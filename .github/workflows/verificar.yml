# Verificação do engenharia (engenharia#21): links internos e testes dos scripts.
name: verificar

on:
  push:
    # main: o C3 da medida MVP lê o último run da principal (engenharia#21)
    # feature/** sai do push: o pull_request cobre as features (engenharia#74)
    branches: ["main", "developer/**"]
  pull_request:
    branches: ["developer/**", "main"]

permissions:
  contents: read

# Cancela o run antigo da mesma branch; na main nada é cancelado (o C3 precisa de cada commit).
concurrency:
  group: verificar-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Links internos dos .md
        run: python scripts/verificar_links.py
      - name: Links internos dos .md (versão Node, a do Acer)
        run: node scripts/verificar_links.mjs
      - name: Testes Node dos scripts
        run: node --test scripts/*.test.mjs
      - name: Testes dos scripts
        run: |
          # Roda cada pasta de scripts que tem test_*.py (as pastas não são pacotes).
          pastas=$(find scripts -name 'test_*.py' -printf '%h\n' | sort -u)
          if [ -z "$pastas" ]; then echo "Nenhum teste encontrado"; exit 1; fi
          for p in $pastas; do
            echo "== $p"
            python -m unittest discover -s "$p" -p 'test_*.py' -v
          done
